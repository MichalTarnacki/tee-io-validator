name: Build binary
permissions: read-all

on:
  push:
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  build:
    name: Build binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_version: [Debug, Release]
    timeout-minutes: 30

    steps:
      - name: Checkout Sources
        uses: actions/checkout@v4

      - name: Initialize and update submodules
        run: git submodule update --init --recursive

      - name: Prepare build directory
        run: mkdir -p teeio-validator/build

      - name: Build
        run: |
              cd teeio-validator/build/
              cmake -DARCH=x64 -DTOOLCHAIN=GCC -DTARGET=${{matrix.build_version}} -DCRYPTO=mbedtls ..
              make -j

      - name: Run host tests
        run: |
              teeio-validator/scripts/run_fault_injection_ut.sh
              teeio-validator/scripts/run_fault_catalog_test.sh teeio-validator/build/bin/teeio_validator
              teeio-validator/scripts/run_regression_selftest.sh
              teeio-validator/scripts/run_campaign_selftest.sh teeio-validator/build/bin/teeio_validator

  build-pqc:
    name: Build SPDM 1.4 PQC requester
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Sources
        uses: actions/checkout@v4

      - name: Initialize and update submodules
        run: git submodule update --init --recursive

      - name: Configure OpenSSL PQC profile
        run: |
              cmake -S teeio-validator -B teeio-validator/build-pqc \
                -DARCH=x64 -DTOOLCHAIN=GCC -DTARGET=Debug \
                -DCRYPTO=openssl -DX509_IGNORE_CRITICAL=ON

      - name: Build
        run: cmake --build teeio-validator/build-pqc --parallel

      - name: Run host tests
        run: |
              teeio-validator/scripts/run_fault_injection_ut.sh
              teeio-validator/scripts/run_fault_catalog_test.sh teeio-validator/build-pqc/bin/teeio_validator
              teeio-validator/scripts/run_regression_selftest.sh
              teeio-validator/scripts/run_campaign_selftest.sh teeio-validator/build-pqc/bin/teeio_validator
  