; SPDM 1.4 requester-side negative scenario catalog.
;
; Select exactly one scenario in [FaultInjection]. Each rule records the
; expected result for machine-readable evidence. The DOE header occupies bytes
; 0..7 and the SPDM header occupies bytes 8..11.

[Main]
debug_level=info
libspdm_log=1
pcap_enable=1
spdm_version=1.4

[FaultInjection]
enabled=0
scenario=B1_header_only

; B1 - malformed messages
[FaultRule_1]
scenario=B1_header_only
expected=error_or_drop_then_recover
direction=send
doe_type=spdm
spdm_code=0xe1
occurrence=1
action=truncate_to
size=12

